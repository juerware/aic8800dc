PACKAGE_NAME="aic8800dc"
PACKAGE_VERSION="6.4.3.0"

# One `make` builds both .ko files (drivers/aic8800/Makefile pulls in both
# aic8800_fdrv/ and aic_load_fw/ as submodules). DKMS runs this with $PWD
# already at the package source root, so the path below is relative to that.
# KDIR is overridden on the command line so this also works when DKMS is
# building for a kernel that was just installed but not yet booted into
# ($kernelver may not match `uname -r` in that case).
MAKE[0]="make -C drivers/aic8800 KDIR=/lib/modules/${kernelver}/build"
CLEAN="make -C drivers/aic8800 clean"

BUILT_MODULE_NAME[0]="aic8800_fdrv"
BUILT_MODULE_LOCATION[0]="drivers/aic8800/aic8800_fdrv"
DEST_MODULE_LOCATION[0]="/kernel/drivers/net/wireless/aic8800"

BUILT_MODULE_NAME[1]="aic_load_fw"
BUILT_MODULE_LOCATION[1]="drivers/aic8800/aic_load_fw"
DEST_MODULE_LOCATION[1]="/kernel/drivers/net/wireless/aic8800"

AUTOINSTALL="yes"
